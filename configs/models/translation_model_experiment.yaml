# Translation-model experiment: 20 models to compare scores on the original translations
# (Gemini 2.5 Flash) and on the gemini-4-argon-low translations (*_argon4low_ep languages).
# Released in the last year (11/2025 or later, except Llama-4 Maverick), with a range of
# performance, size, provider and release date. Models close to chance on Hausa/Luganda (~25%)
# are left out, as they cannot show a difference. No hf- models (Hugging Face endpoints).
# Google models are included on purpose, to check whether Gemini translations favour them.
# Most recent (08-10/2026): no results yet on any language, so they also need a run on the
# original Arabic_ep, Hausa_ep and Luganda_ep (the other models are already cached there)
